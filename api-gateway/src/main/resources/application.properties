spring.application.name=api-gateway
server.port=8084

eureka.client.service-url.defaultZone=http://servidor-eureka:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=servicio-socios
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://servicio-socios
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].args[pattern]=/api/socios/**

