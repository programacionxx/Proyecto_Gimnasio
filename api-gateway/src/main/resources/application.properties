spring.application.name=api-gateway
server.port=8084

eureka.client.service-url.defaultZone=http://servidor-eureka:8761/eureka/


spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=servicio-socios
spring.cloud.gateway.routes[0].uri=lb://servicio-socios
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/socios/**

spring.cloud.gateway.routes[1].id=servicio-membresias
spring.cloud.gateway.routes[1].uri=lb://servicio-membresias
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/membresias/**

