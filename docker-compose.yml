    container_name: servicio-reservas
    ports:
      - "8087:8087"
    depends_on:
      - db
      - servidor-eureka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/db_gimnasio_reservas?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

  servicio-asistencia:
