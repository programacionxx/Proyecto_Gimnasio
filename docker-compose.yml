      - db
      - servidor-eureka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/db_gimnasio_pagos?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

  servicio-clases:
    build: ./servicio-clases
    container_name: servicio-clases
    ports:
      - "8086:8086"
    depends_on:
      - db
      - servidor-eureka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/db_gimnasio_clases?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

  servicio-reservas:
